<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Srivatsav Gorti - Job Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white">
  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center font-bold text-lg shadow-lg shadow-brand-500/20">SG</div>
        <div>
          <h1 class="font-bold text-base leading-tight tracking-tight">Job Tracker</h1>
          <p class="text-xs text-slate-400">Srivatsav Gorti</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <input type="text" id="searchQuery" placeholder="Search..." class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand-500 transition w-36 sm:w-48" />
        <button onclick="triggerSearch()" id="searchBtn" class="px-3.5 py-1.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-medium rounded-lg transition shadow-sm">
          Search
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <span id="resultsCount" class="text-xs text-slate-400">Loading jobs...</span>
    </div>

    <!-- Job Grid -->
    <div id="jobGrid" class="space-y-4">
      <!-- Cards inserted dynamically -->
    </div>
  </main>

  <script>
    let allJobs = [];

    async function loadJobs() {
      try {
        const res = await fetch('/jobs');
        allJobs = await res.json();
        renderJobs(allJobs);
      } catch (err) {
        console.error(err);
        document.getElementById('jobGrid').innerHTML = '<p class="text-center text-red-400 py-12">Failed to load jobs.</p>';
      }
    }

    function renderJobs(jobs) {
      const container = document.getElementById('jobGrid');
      document.getElementById('resultsCountinnerText', `Showing ${jobs.length} position${jobs.length === 1 ? '' : 's'}`);
      document.getElementById('resultsCount').innerText = `Showing ${jobs.length} position${jobs.length === 1 ? '' : 's'}`;
      
      if (jobs.length === 0) {
        container.innerHTML = '<div class="text-center py-16 bg-slate-900/40 border border-slate-800 rounded-2xl"><p class="text-slate-400 text-sm">No matching positions found.</p></div>';
        return;
      }

      container.innerHTML = jobs.map(j => `
        <div class="bg-slate-900/70 border border-slate-800/80 hover:border-slate-700 rounded-2xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 transition-all">
          <div class="space-y-1 flex-1">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-medium text-brand-400 bg-brand-500/10 px-2 py-0.5 rounded">${j.company}</span>
              <span class="text-xs text-slate-500">📍 ${j.location}</span>
            </div>
            <h3 class="font-bold text-base text-slate-100">${j.title}</h3>
            <p class="text-xs text-slate-400 line-clamp-2">${j.description || ''}</p>
          </div>
          <div>
            <button onclick="window.location.href='${j.url || '#'}'" class="inline-flex items-center justify-center px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white text-xs font-medium rounded-xl transition shadow-sm whitespace-nowrap">
              Apply
            </button>
          </div>
        </div>
      `).join('');
    }

    async function triggerSearch() {
      const btn = document.getElementById('searchBtn');
      const query = document.getElementById('searchQuery').value.trim();
      btn.innerText = 'Searching...';
      try {
        const res = await fetch('/scrape', { 
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
        const data = await res.json();
        await loadJobs();
        if (query) {
          const filtered = allJobs.filter(j => 
            j.title.toLowerCase().includes(query.toLowerCase()) || 
            j.company.toLowerCase().includes(query.toLowerCase()) ||
            (j.description && j.description.toLowerCase().includes(query.toLowerCase()))
          );
          renderJobs(filtered);
        }
      } catch (e) {
        console.error(e);
      } finally {
        btn.innerText = 'Search';
      }
    }

    // Allow Enter key in search input
    document.getElementById('searchQuery').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        triggerSearch();
      }
    });

    loadJobs();
  </script>
</body>
</html>
